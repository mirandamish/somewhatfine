<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>this is a place for friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  /* ======================================================================
     EDIT CONFIG BEFORE YOU SHARE THE LINK — see the <script> at the
     bottom of this file. Search for "const CONFIG" to find it.
     ====================================================================== */
  :root{
    --bg: #FFFFFF;
    --bg-soft: #F6F6F4;
    --ink: #161615;
    --ink-soft: #75746E;
    --border: #E6E5E0;
    --accent: #161615;
    --danger: #B23B3B;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Courier Prime', 'Courier New', Courier, monospace;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-transform: lowercase;
  }
  h1,h2,h3{ font-weight: 600; letter-spacing: -0.01em; margin:0; }
  button{ font-family: inherit; cursor: pointer; }
  button, input, select, textarea{ text-transform: inherit; }
  input, textarea{
    font-family: inherit;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  input:focus, textarea:focus{
    border-color: var(--ink);
  }

  /* ---------------- Gate ---------------- */
  #gate{ min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
  .gate-card{ width:100%; max-width: 380px; text-align:center; }
  .gate-card h1{ font-size: 30px; margin-bottom: 8px; }
  .gate-sub{ color: var(--ink-soft); font-size: 15px; margin: 0 0 32px; }
  .field{ text-align:left; margin-bottom: 12px; }
  .field label{ display:block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 5px; font-weight: 500; }
  .field input{ width:100%; }
  .gate-error{ color: var(--danger); font-size: 13px; margin: 6px 0 0; text-align:left; min-height: 16px; }
  .btn-primary{
    width:100%; margin-top: 14px;
    background: var(--accent); color: #fff; border:none; border-radius: 8px;
    padding: 12px; font-size: 15px; font-weight: 500;
  }
  .btn-primary:active{ opacity: 0.85; }

  /* ---------------- App shell ---------------- */
  #app{ display:none; min-height:100vh; }
  header.top{
    position: sticky; top:0; z-index: 5;
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  header.top h1{ font-size: 17px; }
  header.top .sub{ font-size: 12.5px; color: var(--ink-soft); margin-top:2px; }
  .whoami{ font-size: 13px; color: var(--ink-soft); text-align:right; }
  .whoami b{ color: var(--ink); font-weight: 500; }

  nav.tabs{ display:flex; gap: 4px; max-width: 680px; margin: 0 auto; padding: 0 20px; border-bottom: 1px solid var(--border); }
  .tab-btn{
    background:none; border:none; padding: 13px 14px; font-size: 14px; font-weight: 500;
    color: var(--ink-soft); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn.active{ color: var(--ink); border-bottom-color: var(--ink); }

  main{ max-width: 680px; margin: 0 auto; padding: 24px 20px 100px; }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .compose{ border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 24px; }
  .compose textarea{ width:100%; min-height: 68px; resize: vertical; }
  .compose input[type="text"], .compose input[type="password"]{ width: 100%; }
  .compose-row{ display:flex; justify-content:flex-end; margin-top: 10px; }
  .compose-note{ font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; }
  .send-btn{
    background: var(--accent); color: #fff; border:none; border-radius: 8px;
    padding: 9px 16px; font-size: 14px; font-weight: 500;
  }
  .link-btn{
    background:none; border: 1px dashed var(--border); border-radius: 8px;
    padding: 7px 12px; font-size: 13px; color: var(--ink-soft); margin-top: 8px;
  }

  .card{ border-bottom: 1px solid var(--border); padding: 16px 2px; }
  .card.flash{ animation: flash 1.1s ease-out; }
  @keyframes flash{ 0%{ background: var(--bg-soft); } 100%{ background: transparent; } }
  .card-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom: 6px; }
  .who-name{ font-size: 14.5px; font-weight: 500; }
  .who-badge{ font-size: 10.5px; color: var(--ink-soft); border: 1px solid var(--border); padding: 1px 7px; border-radius: 999px; margin-left: 6px; }
  .when{ font-size: 12px; color: var(--ink-soft); white-space:nowrap; }
  .msg-body{ font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }

  .empty{ text-align:center; padding: 50px 20px; color: var(--ink-soft); }
  .empty h3{ font-size: 16px; color: var(--ink); margin-bottom: 4px; }
  .empty p{ margin:0; font-size: 14px; }

  /* Hangout slots */
  .slot-row{ display:flex; gap:8px; margin-bottom: 8px; }
  .slot-row input{ flex:1; }
  .slots{ display:flex; flex-wrap:wrap; gap:8px; margin-top: 10px; }
  .slot-chip{
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
    font-size: 13px; color: var(--ink-soft); background:#fff;
  }
  .slot-chip.mine{ border-color: var(--ink); color: var(--ink); background: var(--bg-soft); }
  .slot-chip b{ font-weight: 600; color: var(--ink); }

  @media (max-width: 480px){
    header.top{ padding: 12px 14px; }
    main{ padding: 18px 14px 90px; }
  }
</style>
</head>

  <main>

    <section class="panel" id="panel-recs">
      <div class="compose">
        <select id="recCategory" style="width:100%; margin-bottom:8px;">
          <option value="book">book</option>
          <option value="movie">movie</option>
          <option value="tv show">tv show</option>

          <option value="other">other</option>
        </select>
        <input id="recTitle" type="text" placeholder="title">
        <div id="recStars" style="margin-top:10px; display:flex; gap:4px;"></div>
        <textarea id="recReview" placeholder="what did you think?" style="margin-top:10px;"></textarea>
        <p class="gate-error" id="recError"></p>
        <div class="compose-row">
          <button class="send-btn" id="recSendBtn">post recommendation</button>
        </div>
      </div>
      <div class="slots" id="recFilters" style="margin-bottom: 16px;"></div>
      <div id="recList"></div>

    <section class="panel" id="panel-chat">

        <input type="file" id="chatImageInput" accept="image/*" style="display:none;">

</div>

<script>

   SITE_PASSWORD    the shared password anyone uses to get into the site
   UPDATE_PASSWORD  a second, separate password — only your friend should

   NOTIFY_EMAILS    every email address that should get notified when your

   SITE_URL         the link to this page, included in notification emails

   STORAGE — this page needs somewhere to save updates/chat/hangouts/recs so
   everyone sees the same thing. That's what FIREBASE_CONFIG is for, using
   Firebase (firebase.google.com), which is free for a group this size and
   needs no server. To turn it on:
     1. Go to https://console.firebase.google.com, create a free project.
     2. In the project, go to Build > Realtime Database > Create Database
        (pick any region, start in test mode).
     3. Go to Project settings > General, scroll to "Your apps", click the
        web icon (</>) to register a web app, and copy the firebaseConfig
        object it gives you into FIREBASE_CONFIG below.
   Until you do that, the site falls back to a temporary storage mode that
   only works while this file is opened inside Claude — fine for previewing,
   but posts won't be visible to anyone once you host this elsewhere, so
   don't skip this step before sharing the real link.

   EMAIL NOTIFICATIONS use EmailJS (emailjs.com), a free service that can
   send email straight from this page — no server needed. To turn it on:
     1. Sign up free at https://www.emailjs.com and connect an email
        service (e.g. Gmail) under "Email Services".
     2. Create an Email Template under "Email Templates". Give it variables
        named exactly: {{to_email}}, {{subject}}, {{message}}, {{site_url}}

     3. Copy your Public Key (Account page), Service ID, and Template ID
        into EMAILJS_PUBLIC_KEY / EMAILJS_SERVICE_ID / EMAILJS_TEMPLATE_ID
        below.
   Until you fill those three in, the site still works fine — it just
   skips sending emails.
   ========================================================================== */
const CONFIG = {
  SITE_PASSWORD: "r-chop",
  UPDATE_PASSWORD: "sharingtime",
  FRIEND_NAME: "alejandro",
  NOTIFY_EMAILS: ["friend1@example.com", "friend2@example.com"],
  SITE_URL: "https://your-site-link-here",
  EMAILJS_PUBLIC_KEY: "YOUR_PUBLIC_KEY",
  EMAILJS_SERVICE_ID: "YOUR_SERVICE_ID",
  EMAILJS_TEMPLATE_ID: "YOUR_TEMPLATE_ID",
  FIREBASE_CONFIG: {
  apiKey: "AIzaSyALQYlYApR58-0oSuq9cVRuZA0O8SvYtis",

  projectId: "siteforalejandro",
  storageBucket: "siteforalejandro.firebasestorage.app",

  appId: "1:751299202601:web:d62352023f08eaea019638",
  measurementId: "G-FH0571YXV1"

};

let db = null;
try{
  if(window.firebase && CONFIG.FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY"){
    firebase.initializeApp(CONFIG.FIREBASE_CONFIG);
    db = firebase.database();
  }
}catch(e){ console.error('firebase init failed', e); }

document.getElementById('updateLockedNote').textContent = `Only ${CONFIG.FRIEND_NAME} can post updates. Enter the password to unlock the box below.`;

const emailReady = () => !!window.emailjs && CONFIG.EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY";
if(emailReady()){
  emailjs.init({ publicKey: CONFIG.EMAILJS_PUBLIC_KEY });
}
async function notifyEveryone(subject, message){
  if(!emailReady()) { console.log('Email notifications not configured — skipping.'); return; }
  try{
    await Promise.all(CONFIG.NOTIFY_EMAILS.map(to =>
      emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.EMAILJS_TEMPLATE_ID, {
        to_email: to, subject, message, site_url: CONFIG.SITE_URL
      })
    ));

}

let me = { name: '' };
let updateUnlocked = false;
let pendingUpdateImage = null;
let pendingChatImage = null;
let recRating = 0;
let recFilter = 'all';

function compressImage(file, maxSize=900, quality=0.7){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxSize || height > maxSize){
          if(width > height){ height = Math.round(height * maxSize / width); width = maxSize; }
          else { width = Math.round(width * maxSize / height); height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPreview(container, dataUrl, onRemove){
  if(!dataUrl){ container.innerHTML = ''; return; }
  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative; display:inline-block; margin-top:10px;';
  const img = document.createElement('img');
  img.src = dataUrl;
  img.style.cssText = 'max-width:160px; max-height:160px; border-radius:8px; display:block; border:1px solid var(--border);';
  const x = document.createElement('button');
  x.type = 'button';
  x.textContent = 'remove';
  x.className = 'link-btn';
  x.style.cssText = 'margin-top:6px;';
  x.addEventListener('click', onRemove);
  wrap.appendChild(img);
  container.appendChild(wrap);
  container.appendChild(x);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function initials(name){
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('') || '?';
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'}) + ' at ' + d.toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
}

document.getElementById('enterBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('nameInput').value.trim();
  const pass = document.getElementById('passInput').value;
  const errEl = document.getElementById('gateError');
  errEl.textContent = '';
  if(!name){ errEl.textContent = 'Enter your name to continue.'; return; }
  if(pass !== CONFIG.SITE_PASSWORD){ errEl.textContent = "That password doesn't match. Try again."; return; }

  me.name = name;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('whoamiName').textContent = me.name;

  await refreshUpdates();
  await refreshHangouts();
  await refreshRecs();
  await refreshChat();
  setInterval(()=>{ refreshUpdates(); refreshHangouts(); refreshRecs(); refreshChat(); }, 4000);
});

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

let seenUpdateIds = new Set(), seenChatIds = new Set(), seenHangoutIds = new Set(), seenRecIds = new Set();

async function loadFeed(key){
  if(db){
    try{
      const snap = await db.ref(key).get();
      return snap.exists() ? snap.val() : [];
    }catch(e){ console.error('firebase read error', e); return []; }
  }
  try{
    const res = await window.storage.get(key, true);
    return res ? JSON.parse(res.value) : [];
  }catch(e){ return []; }
}
async function saveFeed(key, arr){
  if(db){
    try{ await db.ref(key).set(arr); return; }
    catch(e){ console.error('firebase write error', e); return; }
  }
  try{ await window.storage.set(key, JSON.stringify(arr), true); }
  catch(e){ console.error('storage error', e); }
}

/* ---------------- Updates ---------------- */
document.getElementById('unlockUpdateBtn').addEventListener('click', ()=>{
  const pass = document.getElementById('updatePassInput').value;
  const err = document.getElementById('updateUnlockError');
  if(pass !== CONFIG.UPDATE_PASSWORD){ err.textContent = "That's not the right password."; return; }
  err.textContent = '';
  updateUnlocked = true;
  document.getElementById('updateLocked').style.display = 'none';
  document.getElementById('updateUnlocked').style.display = 'block';
});

document.getElementById('updateImageBtn').addEventListener('click', ()=>{
  document.getElementById('updateImageInput').click();
});
document.getElementById('updateImageInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  pendingUpdateImage = await compressImage(file);
  renderPreview(document.getElementById('updateImagePreview'), pendingUpdateImage, ()=>{
    pendingUpdateImage = null;
    document.getElementById('updateImageInput').value = '';
    renderPreview(document.getElementById('updateImagePreview'), null);
  });
});

document.getElementById('updateSendBtn').addEventListener('click', async ()=>{
  const ta = document.getElementById('updateText');
  const text = ta.value.trim();
  if(!text && !pendingUpdateImage) return;
  if(!updateUnlocked) return;
  const list = await loadFeed('site:updates');
  list.push({ id: 'u'+Date.now()+Math.random().toString(36).slice(2,7), author: CONFIG.FRIEND_NAME, text, image: pendingUpdateImage, ts: Date.now() });
  await saveFeed('site:updates', list);
  ta.value = '';
  pendingUpdateImage = null;
  document.getElementById('updateImageInput').value = '';
  renderPreview(document.getElementById('updateImagePreview'), null);
  await refreshUpdates();
  notifyEveryone(`${CONFIG.FRIEND_NAME} posted an update`, text || '(photo)');
});

function renderUpdates(list){
  const el = document.getElementById('updatesList');
  if(list.length === 0){
    el.innerHTML = `<div class="empty"><h3>no updates yet</h3><p>the first one will show up here.</p></div>`;
    return;
  }
  const sorted = [...list].sort((a,b)=>b.ts-a.ts);
  el.innerHTML = sorted.map(u=>{
    const isNew = !seenUpdateIds.has(u.id);
    return `<div class="card ${isNew && seenUpdateIds.size>0 ? 'flash':''}">
      <div class="card-head">
        <span class="who-name">${escapeHtml(u.author)}<span class="who-badge">update</span></span>
        <span class="when">${timeAgo(u.ts)}</span>
      </div>
      ${u.text ? `<div class="msg-body">${escapeHtml(u.text)}</div>` : ''}
      ${u.image ? `<img src="${u.image}" style="max-width:100%; border-radius:8px; margin-top:10px; display:block; border:1px solid var(--border);">` : ''}
    </div>`;
  }).join('');
  list.forEach(u=>seenUpdateIds.add(u.id));
}
async function refreshUpdates(){ renderUpdates(await loadFeed('site:updates')); }

/* ---------------- Chat ---------------- */
function renderChat(list){
  const el = document.getElementById('chatList');
  if(list.length === 0){
    el.innerHTML = `<div class="empty"><h3>it's quiet in here</h3><p>say hello.</p></div>`;
    return;
  }
  const sorted = [...list].sort((a,b)=>b.ts-a.ts);
  el.innerHTML = sorted.map(m=>{
    const isNew = !seenChatIds.has(m.id);
    return `<div class="card ${isNew && seenChatIds.size>0 ? 'flash':''}">
      <div class="card-head">
        <span class="who-name">${escapeHtml(m.author)}</span>
        <span class="when">${timeAgo(m.ts)}</span>
      </div>
      ${m.text ? `<div class="msg-body">${escapeHtml(m.text)}</div>` : ''}
      ${m.image ? `<img src="${m.image}" style="max-width:100%; border-radius:8px; margin-top:10px; display:block; border:1px solid var(--border);">` : ''}
    </div>`;
  }).join('');
  list.forEach(m=>seenChatIds.add(m.id));
}
async function refreshChat(){ renderChat(await loadFeed('site:chat')); }

document.getElementById('chatImageBtn').addEventListener('click', ()=>{
  document.getElementById('chatImageInput').click();
});
document.getElementById('chatImageInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  pendingChatImage = await compressImage(file);
  renderPreview(document.getElementById('chatImagePreview'), pendingChatImage, ()=>{
    pendingChatImage = null;
    document.getElementById('chatImageInput').value = '';
    renderPreview(document.getElementById('chatImagePreview'), null);
  });
});

async function sendChat(){
  const inp = document.getElementById('chatText');
  const text = inp.value.trim();
  if(!text && !pendingChatImage) return;
  const list = await loadFeed('site:chat');
  list.push({ id: 'c'+Date.now()+Math.random().toString(36).slice(2,7), author: me.name, text, image: pendingChatImage, ts: Date.now() });
  await saveFeed('site:chat', list);
  inp.value = '';
  pendingChatImage = null;
  document.getElementById('chatImageInput').value = '';
  renderPreview(document.getElementById('chatImagePreview'), null);
  await refreshChat();
}
document.getElementById('chatSendBtn').addEventListener('click', sendChat);

/* ---------------- Hangout scheduler ---------------- */
document.getElementById('addSlotBtn').addEventListener('click', ()=>{
  const row = document.createElement('div');
  row.className = 'slot-row';
  row.innerHTML = '<input class="slot-input" type="text" placeholder="another proposed time">';
  document.getElementById('slotRows').appendChild(row);
});

document.getElementById('hangoutSendBtn').addEventListener('click', async ()=>{
  const title = document.getElementById('hangoutTitle').value.trim();
  const note = document.getElementById('hangoutNote').value.trim();
  const slotInputs = [...document.querySelectorAll('.slot-input')].map(i=>i.value.trim()).filter(Boolean);
  const err = document.getElementById('hangoutError');
  err.textContent = '';
  if(!title){ err.textContent = 'Give it a title first.'; return; }
  if(slotInputs.length === 0){ err.textContent = 'Add at least one proposed time.'; return; }

  const list = await loadFeed('site:hangouts');
  const hangout = {
    id: 'h'+Date.now()+Math.random().toString(36).slice(2,7),
    title, note, author: me.name, ts: Date.now(),
    slots: slotInputs.map((label,i)=>({ id: 's'+i+Date.now(), label, votes: [] }))
  };
  list.push(hangout);
  await saveFeed('site:hangouts', list);

  document.getElementById('hangoutTitle').value = '';
  document.getElementById('hangoutNote').value = '';
  document.getElementById('slotRows').innerHTML = '<div class="slot-row"><input class="slot-input" type="text" placeholder="proposed time, e.g. sat 7pm pt"></div>';

  await refreshHangouts();
  const slotText = hangout.slots.map(s=>s.label).join(', ');
  notifyEveryone(`${me.name} wants to hang out: ${title}`, `${note ? note + '\n\n' : ''}Proposed times: ${slotText}`);
});

function renderHangouts(list){
  const el = document.getElementById('hangoutList');
  if(list.length === 0){
    el.innerHTML = `<div class="empty"><h3>nothing planned yet</h3><p>propose a time above.</p></div>`;
    return;
  }
  const sorted = [...list].sort((a,b)=>b.ts-a.ts);
  el.innerHTML = sorted.map(h=>{
    const isNew = !seenHangoutIds.has(h.id);
    const slots = h.slots.map(s=>{
      const mine = s.votes.includes(me.name);
      return `<button type="button" class="slot-chip ${mine?'mine':''}" data-hangout="${h.id}" data-slot="${s.id}">
        ${escapeHtml(s.label)} <b>${s.votes.length || ''}</b>
      </button>`;
    }).join('');
    return `<div class="card ${isNew && seenHangoutIds.size>0 ? 'flash':''}">
      <div class="card-head">
        <span class="who-name">${escapeHtml(h.title)}</span>
        <span class="when">${escapeHtml(h.author)} · ${timeAgo(h.ts)}</span>
      </div>
      ${h.note ? `<div class="msg-body">${escapeHtml(h.note)}</div>` : ''}
      <div class="slots">${slots}</div>
    </div>`;
  }).join('');
  list.forEach(h=>seenHangoutIds.add(h.id));
}
async function refreshHangouts(){ renderHangouts(await loadFeed('site:hangouts')); }

document.getElementById('hangoutList').addEventListener('click', async (e)=>{
  const chip = e.target.closest('.slot-chip');
  if(!chip) return;
  const hangoutId = chip.dataset.hangout, slotId = chip.dataset.slot;
  const list = await loadFeed('site:hangouts');
  const h = list.find(x=>x.id===hangoutId);
  if(!h) return;
  const slot = h.slots.find(s=>s.id===slotId);
  if(!slot) return;
  const idx = slot.votes.indexOf(me.name);
  if(idx===-1) slot.votes.push(me.name); else slot.votes.splice(idx,1);
  await saveFeed('site:hangouts', list);
  await refreshHangouts();
});

/* ---------------- Recommendations ---------------- */
function renderStarPicker(){
  const el = document.getElementById('recStars');
  el.innerHTML = '';
  for(let i=1; i<=5; i++){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = i <= recRating ? '★' : '☆';
    b.style.cssText = 'background:none; border:none; font-size:22px; color:var(--ink); padding:0 2px; line-height:1;';
    b.addEventListener('click', ()=>{ recRating = i; renderStarPicker(); });
    el.appendChild(b);
  }
}
renderStarPicker();

function starString(n){
  return '★'.repeat(n) + '☆'.repeat(5-n);
}

document.getElementById('recSendBtn').addEventListener('click', async ()=>{
  const category = document.getElementById('recCategory').value;
  const title = document.getElementById('recTitle').value.trim();
  const review = document.getElementById('recReview').value.trim();
  const err = document.getElementById('recError');
  err.textContent = '';
  if(!title){ err.textContent = 'add a title first.'; return; }
  if(recRating === 0){ err.textContent = 'pick a star rating.'; return; }

  const list = await loadFeed('site:recs');
  list.push({
    id: 'r'+Date.now()+Math.random().toString(36).slice(2,7),
    author: me.name, category, title, rating: recRating, review, ts: Date.now()
  });
  await saveFeed('site:recs', list);

  document.getElementById('recTitle').value = '';
  document.getElementById('recReview').value = '';
  recRating = 0;
  renderStarPicker();
  await refreshRecs();
});

function renderRecFilters(list){
  const cats = ['all', ...new Set(list.map(r=>r.category))];
  const el = document.getElementById('recFilters');
  el.innerHTML = cats.map(c=>
    `<button type="button" class="slot-chip ${recFilter===c?'mine':''}" data-filter="${escapeHtml(c)}">${escapeHtml(c)}</button>`
  ).join('');
}
document.getElementById('recFilters').addEventListener('click', async (e)=>{
  const chip = e.target.closest('[data-filter]');
  if(!chip) return;
  recFilter = chip.dataset.filter;
  await refreshRecs();
});

function renderRecs(list){
  renderRecFilters(list);
  const el = document.getElementById('recList');
  const filtered = recFilter === 'all' ? list : list.filter(r=>r.category===recFilter);
  if(filtered.length === 0){
    el.innerHTML = `<div class="empty"><h3>nothing here yet</h3><p>be the first to recommend something.</p></div>`;
    return;
  }
  const sorted = [...filtered].sort((a,b)=>b.ts-a.ts);
  el.innerHTML = sorted.map(r=>{
    const isNew = !seenRecIds.has(r.id);
    return `<div class="card ${isNew && seenRecIds.size>0 ? 'flash':''}">
      <div class="card-head">
        <span class="who-name">${escapeHtml(r.title)}<span class="who-badge">${escapeHtml(r.category)}</span></span>
        <span class="when">${escapeHtml(r.author)} · ${timeAgo(r.ts)}</span>
      </div>
      <div class="msg-body" style="letter-spacing:2px;">${starString(r.rating)}</div>
      ${r.review ? `<div class="msg-body" style="margin-top:6px;">${escapeHtml(r.review)}</div>` : ''}
    </div>`;
  }).join('');
  list.forEach(r=>seenRecIds.add(r.id));
}
async function refreshRecs(){ renderRecs(await loadFeed('site:recs')); }
</script>
